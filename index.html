<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinetica.css - Modern Animation Library</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Fira+Code&display=swap" rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="kinetica.css">
</head>
<body>
    <canvas id="particleCanvas"></canvas>
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <nav class="navbar">
        <a href="index.html" class="nav-brand">Kinetica</a>
        <button class="menu-toggle">
            <span></span><span></span><span></span>
        </button>
        <div class="nav-links">
            <a href="index.html" class="active">Playground</a>
            <a href="components.html">Components</a>
            <a href="docs.html">Docs</a>
            <a href="faq.html">FAQ</a>
        </div>
    </nav>

    <header>
        <h1 class="logo">Kinetica.css</h1>
        <p class="subtitle">A lightweight, plug-and-play CSS animation library for modern web applications.</p>
        
        <div class="cdn-container">
            <div class="cdn-code" id="cdnCode">&lt;link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/brightlabssolution-jpg/kinetica/kinetica.css"&gt;</div>
            <button class="copy-btn" id="copyBtn">Copy Link</button>
        </div>
    </header>

    <main class="playground-main">
        <div class="panel" data-animate="fadeInLeft">
            <h2>Animations</h2>
            <div id="animationsContainer">
                <!-- Animation groups injected by JS -->
            </div>
        </div>

        <div class="panel preview-container" data-animate="fadeInRight">
            <h2>Preview</h2>
            <div class="box animated" id="previewBox">
                Kinetica
            </div>
            
            <div class="controls">
                <div class="control-group">
                    <input type="checkbox" id="infiniteToggle">
                    <label for="infiniteToggle">Infinite</label>
                </div>
                <div class="control-group slider-group">
                    <label for="durationSlider">Duration: <span id="durationVal">1.0s</span></label>
                    <input type="range" id="durationSlider" min="0.1" max="5.0" step="0.1" value="1.0">
                </div>
                <div class="control-group slider-group">
                    <label for="delaySlider">Delay: <span id="delayVal">0.0s</span></label>
                    <input type="range" id="delaySlider" min="0.0" max="3.0" step="0.1" value="0.0">
                </div>
            </div>
        </div>
    </main>

    <script src="mobile-menu.js"></script>
    <script src="particles.js"></script>
    <script src="scroll-animate.js"></script>
    <script src="app.js"></script>
</body>
</html>
